<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>Hormiga Macho V3.2</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f4f4f4;color:#171717}
main{max-width:760px;margin:auto;padding:14px}
h1{font-size:1.55rem;margin:5px 0}
.info{background:white;padding:12px 14px;border-radius:14px;margin:10px 0 12px}
model-viewer{width:100%;height:70vh;min-height:450px;background:#fff;border-radius:18px;box-shadow:0 8px 28px #0002}
#ar-button{border:0;border-radius:999px;padding:14px 20px;background:#111;color:white;font-weight:750;font-size:16px}
</style>
</head>
<body>
<main>
<h1>🪽 Hormiga Macho — V3.2</h1>
<div class="info">
<strong>Alas corregidas según los ejes reales del modelo.</strong><br>
Dos alas anteriores grandes + dos posteriores menores, distribuidas simétricamente a ambos lados.<br><br>
👆 Mover &nbsp; 🔄 Girar &nbsp; 🤏 Cambiar tamaño
</div>

<model-viewer
 src="macho-hormiga-v3-2.glb?v=32"
 camera-controls
 auto-rotate
 autoplay
 shadow-intensity="1.2"
 shadow-softness="0.8"
 environment-image="neutral"
 ar
 ar-modes="webxr scene-viewer"
 ar-placement="floor"
 ar-scale="auto">
 <button id="ar-button" slot="ar-button">📷 Ver en realidad aumentada</button>
</model-viewer>
</main>
</body>
</html>
