<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hormiga realista 3D | Realidad Aumentada</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f4f4f4;color:#171717}
main{max-width:760px;margin:auto;padding:14px}
h1{font-size:1.55rem;margin:5px 0}
.intro{margin:4px 0 12px;color:#444}
model-viewer{width:100%;height:68vh;min-height:440px;background:#fff;border-radius:18px;box-shadow:0 8px 28px #0002}
#ar-button{border:0;border-radius:999px;padding:14px 20px;background:#111;color:#fff;font-weight:750;font-size:16px;box-shadow:0 5px 18px #0003}
.credit{font-size:.78rem;color:#666;line-height:1.35;margin:12px 4px}
</style>
</head>
<body>
<main>
<h1>🐜 Hormiga en 3D</h1>
<p class="intro">Gírala con el dedo o colócala en tu espacio usando la cámara.</p>

<model-viewer
 src="hormiga.glb"
 alt="Modelo 3D realista de una hormiga"
 camera-controls
 touch-action="pan-y"
 auto-rotate
 shadow-intensity="1.2"
 shadow-softness="0.8"
 exposure="1"
 environment-image="neutral"
 ar
 ar-modes="webxr scene-viewer"
 ar-placement="floor"
 ar-scale="auto"
 camera-orbit="35deg 70deg auto"
 min-camera-orbit="auto auto 35%"
 max-camera-orbit="auto auto 400%">
 <button id="ar-button" slot="ar-button">📷 Ver en realidad aumentada</button>
</model-viewer>

<p class="credit">
Modelo 3D “ANT” de MAXDESIGN-3D, utilizado bajo licencia Creative Commons Attribution (CC BY).
</p>
</main>
</body>
</html>
