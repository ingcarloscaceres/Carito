<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Hormiga realista 3D V4</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:#f4f4f4;
  color:#171717
}
main{max-width:760px;margin:auto;padding:14px}
h1{font-size:1.55rem;margin:5px 0}
p{line-height:1.4}
model-viewer{
  width:100%;
  height:66vh;
  min-height:430px;
  background:#fff;
  border-radius:18px;
  box-shadow:0 8px 28px #0002
}
#ar-button{
  border:0;
  border-radius:999px;
  padding:14px 20px;
  background:#111;
  color:#fff;
  font-weight:750;
  font-size:16px;
  box-shadow:0 5px 18px #0003
}
.help{
  background:#fff;
  border-radius:14px;
  padding:12px 15px;
  margin:12px 0;
  box-shadow:0 3px 12px #0001;
}
.help strong{display:block;margin-bottom:5px}
.credit{font-size:.78rem;color:#666}
.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:999px;
  background:#e9e9e9;
  font-size:.82rem
}
</style>
</head>

<body>
<main>

<h1>🐜 Hormiga realista 3D — V4</h1>
<p><span class="badge">RA interactiva</span></p>

<div class="help">
  <strong>Gestos en realidad aumentada</strong>
  👆 Arrastra para moverla por el piso.<br>
  🔄 Gira con el gesto de rotación.<br>
  🤏 Separa o junta dos dedos para aumentar o reducir su tamaño.
</div>

<model-viewer
 id="ant"
 src="hormiga-realista-v2.glb?v=4"
 alt="Hormiga 3D realista"
 camera-controls
 auto-rotate
 touch-action="pan-y"
 shadow-intensity="1.2"
 shadow-softness="0.8"
 environment-image="neutral"
 scale="0.00015 0.00015 0.00015"
 ar
 ar-modes="webxr scene-viewer"
 ar-placement="floor"
 ar-scale="auto">

 <button id="ar-button" slot="ar-button">
   📷 Ver en realidad aumentada
 </button>

</model-viewer>

<p class="credit">
Modelo “ANT” de MAXDESIGN-3D — Creative Commons Attribution (CC BY).
</p>

</main>
</body>
</html>
