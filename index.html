<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Hormiga 3D interactiva V5</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f4f4f4;color:#171717}
main{max-width:760px;margin:auto;padding:14px}
h1{font-size:1.55rem;margin:5px 0}
p{line-height:1.4}
.help{background:#fff;border-radius:14px;padding:12px 15px;margin:10px 0 12px;box-shadow:0 3px 12px #0001}
.help strong{display:block;margin-bottom:6px}
model-viewer{width:100%;height:66vh;min-height:430px;background:#fff;border-radius:18px;box-shadow:0 8px 28px #0002}
#ar-button{border:0;border-radius:999px;padding:14px 20px;background:#111;color:#fff;font-weight:750;font-size:16px;box-shadow:0 5px 18px #0003}
.credit{font-size:.78rem;color:#666}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#e9e9e9;font-size:.82rem}
</style>
</head>
<body>
<main>
<h1>🐜 Hormiga realista 3D — V5</h1>
<p><span class="badge">Escala corregida dentro del modelo</span></p>

<div class="help">
<strong>En realidad aumentada</strong>
👆 Arrastra la hormiga para cambiarla de posición.<br>
🔄 Usa dos dedos para girarla.<br>
🤏 Junta o separa dos dedos para reducirla o ampliarla.
</div>

<model-viewer
 src="hormiga-interactiva-v5.glb?v=5"
 alt="Hormiga 3D realista e interactiva"
 camera-controls
 auto-rotate
 autoplay
 touch-action="pan-y"
 shadow-intensity="1.2"
 shadow-softness="0.8"
 environment-image="neutral"
 ar
 ar-modes="webxr scene-viewer"
 ar-placement="floor"
 ar-scale="auto">
 <button id="ar-button" slot="ar-button">📷 Ver en realidad aumentada</button>
</model-viewer>

<p class="credit">Modelo “ANT” de MAXDESIGN-3D — Creative Commons Attribution (CC BY).</p>
</main>
</body>
</html>
