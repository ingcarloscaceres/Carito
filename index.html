<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Hormiga realista 3D V3</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f4f4f4;color:#171717}
main{max-width:760px;margin:auto;padding:14px}
h1{font-size:1.55rem;margin:5px 0}
p{line-height:1.4}
model-viewer{width:100%;height:68vh;min-height:440px;background:#fff;border-radius:18px;box-shadow:0 8px 28px #0002}
#ar-button{border:0;border-radius:999px;padding:14px 20px;background:#111;color:#fff;font-weight:750;font-size:16px;box-shadow:0 5px 18px #0003}
.credit{font-size:.78rem;color:#666}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#e9e9e9;font-size:.82rem}
</style>
</head>
<body>
<main>
<h1>🐜 Hormiga realista 3D — V3</h1>
<p><span class="badge">Escala AR corregida ≈ 23 cm</span></p>
<p>Gira el modelo y luego colócalo sobre el piso. Esta versión corrige la escala del archivo original para realidad aumentada.</p>

<model-viewer
 id="ant"
 src="hormiga-realista-v2.glb?v=3"
 alt="Hormiga 3D realista"
 camera-controls
 auto-rotate
 touch-action="pan-y"
 shadow-intensity="1.2"
 shadow-softness="0.8"
 environment-image="neutral"
 scale="0.00015 0.00015 0.00015"
 ar
 ar-modes="webxr scene-viewer"
 ar-placement="floor"
 ar-scale="fixed">
 <button id="ar-button" slot="ar-button">📷 Ver en realidad aumentada</button>
</model-viewer>

<p class="credit">Modelo “ANT” de MAXDESIGN-3D — Creative Commons Attribution (CC BY).</p>
</main>
</body>
</html>
